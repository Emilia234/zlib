name: Build zlib

on:
  push:
    branches:
      - ino_dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt update && sudo apt install -y build-essential cmake

    - name: Build zlib
      run: |
        mkdir build
        cd build
        cmake ..
        make

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: zlib-binary
        path: build/libz.*
